name: Release

# Publishes all NeoReports packages to NuGet when a version tag is pushed.
# Tag the release commit as vX.Y.Z (e.g. v1.0.0); the version is derived from the tag.
#
# "All" now genuinely means all: since D83 the three commercial Pro packages are IsPackable=true and
# are picked up by the solution-wide pack below, so this workflow publishes them alongside the MIT
# ones (they carry their own PolyForm LICENSE.txt rather than the repo-wide MIT expression). The
# separate pack-pro.yml that used to upload them as build artifacts is gone — it existed only for
# D30's "never published to a feed" stance, which D70 reversed. There is no human step between a
# v* tag and a public NuGet push, which is why NeoReports.Licensing has a test asserting the
# embedded signing key is not the burned placeholder.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Pack & publish to NuGet
    runs-on: ubuntu-latest
    # Same reasoning as ci.yml. Job durations measured 1.4–4.8 minutes, so 30 is well clear — and a
    # release blocked for an afternoon by a stalled download is worse than one that fails fast and
    # can be re-run on the same tag.
    timeout-minutes: 30
    # Requires a NUGET_API_KEY secret. The job is skipped on forks without it.
    if: ${{ github.repository == 'thiagoluga/NeoReports' }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (8 + 9)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore NeoReports.sln

      - name: Build
        run: dotnet build NeoReports.sln --configuration Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Install Playwright browsers
        # Without this the E2E suite self-skips and the release gate would verify only that the host
        # boots — 3 of its 16 tests — while looking green. Same stance as the Docker gate below.
        #
        # Bounded because this is the step that has actually hung, fetching browser binaries from an
        # external CDN: it stalled 27 minutes on PR #287 before being cancelled by hand, then for the
        # full 6-hour job default on PR #295. Successful installs measured 23s–4m48s (median 28s) over
        # the last 15 runs, so 15 is about three times the worst observed. A timeout is still a
        # failure, which is the behaviour the note above asks for.
        timeout-minutes: 15
        run: pwsh tests/NeoReports.WebUi.E2ETests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Test
        env:
          # Never publish a release whose integration suites silently skipped for a broken/missing
          # Docker on the runner — hard-fail instead (see tests/Shared/DockerGate.cs).
          NEOREPORTS_REQUIRE_DOCKER: "1"
          NEOREPORTS_REQUIRE_BROWSER: "1"
        run: dotnet test NeoReports.sln --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack NeoReports.sln --configuration Release --no-build -o ./artifacts -p:Version=${{ steps.ver.outputs.version }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "NUGET_API_KEY not set — skipping push." && exit 0
          fi
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
