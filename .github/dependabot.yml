version: 2
updates:
  # NuGet packages (centrally managed in build/Directory.Packages.props)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Keep related ecosystem bumps together to reduce PR noise.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      # Not noise-reduction: a CORRECTNESS requirement. Hangfire.NetCore arrives transitively and
      # pins Hangfire.Core to an exact version, so bumping any one member alone fails restore with
      # NU1608 — PRs #246 and #247 could never go green on their own, whatever CI did. The family
      # only moves as a unit.
      hangfire:
        patterns:
          - "Hangfire*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "FluentAssertions"
          - "NSubstitute"
          - "Testcontainers*"
          - "coverlet*"

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
