# SonarCloud configuration for NeoReports.
# The .NET analysis is driven by dotnet-sonarscanner in .github/workflows/sonar.yml,
# which passes the project key, organization, and coverage report on the command line.
# This file documents the canonical values and any extra settings.

sonar.projectKey=lugarini_NeoReports
sonar.organization=lugarini

# Human-friendly name shown in the SonarCloud UI.
sonar.projectName=NeoReports

# Source and test layout.
sonar.sources=src
sonar.tests=tests

# Exclude generated/sample/benchmark code from the main analysis.
sonar.exclusions=samples/**,benchmarks/**

# Coverage report produced by dotnet-coverage (see the Sonar workflow).
sonar.cs.vscoveragexml.reportsPaths=coverage.xml
